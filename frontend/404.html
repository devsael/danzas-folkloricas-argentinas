<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <!-- cache-bust: 2025-08-24-3 -->
    <title>Redirigiendo...</title>
    <script>
        // SPA fallback para GitHub Pages: redirige INMEDIATAMENTE al hash
        // para que el router del lado del cliente (pushState) pueda manejarla.
        (function() {
            var path = window.location.pathname;
            // Evita redirigir assets (css, js, imágenes, etc.)
            if (/\.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|json|xml|txt)$/i.test(path)) {
                return;
            }
            // Redirige INMEDIATAMENTE al hash para que el router SPA la maneje.
            var redirectUrl = '/' + path.slice(1).replace(/\/$/, '') + (window.location.search || '');
            window.location.replace('/#' + redirectUrl);
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=/">
    <title>Redirigiendo...</title>
</head>
<body>
    <script>
        // Fallback inmediato por si el script del head no corrió
        (function() {
            var path = window.location.pathname;
            if (!/\.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|json|xml|txt)$/i.test(path)) {
                window.location.replace('/#' + window.location.pathname.slice(1) + (window.location.search || ''));
            }
        })();
    </script>
</body>
</html>
